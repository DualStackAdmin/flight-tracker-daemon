# Public holidays (non-working days) in AZERBAIJAN.
#
# Used to tell you when a round trip needs few or no vacation days.
# If a holiday falls on a Saturday or Sunday, the next working day is also off
# (Labour Code); the app adds those days automatically when
# `weekend_carry_over: true`.
#
# NOT included and worth adding by hand each year:
#   - extra day transfers announced by the Cabinet of Ministers
#   - exact Ramazan / Gurban dates (they follow the lunar calendar; dates below
#     are the expected ones and can shift by a day)
# Last reviewed: 2026-10. Edit freely and send a pull request.
#
# Other countries: copy this file to holidays_XX.yaml (XX = country code).

weekend_carry_over: true

holidays:
  # ---------- 2026 ----------
  2026-01-01: New Year
  2026-01-02: New Year
  2026-01-20: National Mourning Day
  2026-03-08: Women's Day
  2026-03-20: Novruz / Ramazan Bayram
  2026-03-21: Novruz / Ramazan Bayram
  2026-03-22: Novruz
  2026-03-23: Novruz
  2026-03-24: Novruz
  2026-05-09: Victory over Fascism Day
  2026-05-27: Gurban Bayram
  2026-05-28: Gurban Bayram / Independence Day
  2026-06-15: National Salvation Day
  2026-06-26: Armed Forces Day
  2026-11-08: Victory Day
  2026-11-09: State Flag Day
  2026-12-31: Solidarity Day

