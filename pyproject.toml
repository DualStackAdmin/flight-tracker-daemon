[project]
name = "flight-tracker-daemon"
version = "1.0.0"
description = "Self-hosted cheap flight tracker that runs 24/7 on Linux and sends Telegram alerts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ulvi Guluzada" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6"]
keywords = ["flights", "price-tracker", "telegram-bot", "travel", "self-hosted", "systemd"]

[project.urls]
Homepage = "https://github.com/DualStackAdmin/flight-tracker-daemon"
Issues = "https://github.com/DualStackAdmin/flight-tracker-daemon/issues"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
